project:
  type: website
  output-dir: _site
  resources:
    - cv.pdf

website:
  title: "Bipin Yadu"
  site-url: "https://bipinyadu.github.io"
  page-footer:
    center: "© <span class='current-year'></span> Bipin Yadu · Last updated <span class='last-updated'></span>"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    page-layout: article
    # Fills in the year and the "last updated" date automatically
    include-after-body:
      text: |
        <script>
          document.querySelectorAll('.current-year').forEach(e => e.textContent = new Date().getFullYear());
          const updated = new Date(document.lastModified).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
          document.querySelectorAll('.last-updated').forEach(e => e.textContent = updated);
        </script>
